# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- main

pool:
  name: 'Default'

variables:
  - group: aws_ecr
  - name: IMAGE_TAG
    value: $(Build.BuildId)

stages:

- stage: CI
  displayName: Run Tests & Security Scan
  jobs:
    - job: Test
      steps:
        - checkout: self

        - script: |
            echo "Installing dependencies..."
            npm install
          workingDirectory: project
          displayName: Install Dependencies

        - script: |
            echo "Running unit tests..."
            npm test
          workingDirectory: project
          displayName: Unit Tests

        - script: |
            echo "Running integration tests..."
            npm run test:integration
          workingDirectory: project
          displayName: Integration Tests

        - script: |
            echo "Dependency security scan..."
            trivy fs --severity HIGH,CRITICAL .
          workingDirectory: project
          displayName: Dependency Scan


- stage: BuildScanPush
  jobs:
    - job: BuildScanPushJob
      steps:
        - script: |
            echo "Login to ECR"
            aws ecr get-login-password --region "$(AWS_REGION)" | \
            docker login --username AWS --password-stdin "$(AWS_ACCOUNT_ID).dkr.ecr.$(AWS_REGION).amazonaws.com"

            echo "Build images"
            docker build -t $(AWS_ECR_REGISTRY):app-$(IMAGE_TAG) -f project/docker/app/Dockerfile .
            docker build -t $(AWS_ECR_REGISTRY):nginx-$(IMAGE_TAG) -f project/docker/nginx/Dockerfile .

            echo "Scan images"
            trivy image --exit-code 1 --severity HIGH,CRITICAL $(AWS_ECR_REGISTRY):app-$(IMAGE_TAG)
            trivy image --exit-code 1 --severity HIGH,CRITICAL $(AWS_ECR_REGISTRY):nginx-$(IMAGE_TAG)

            echo "Push images"
            docker push $(AWS_ECR_REGISTRY):app-$(IMAGE_TAG)
            docker push $(AWS_ECR_REGISTRY):nginx-$(IMAGE_TAG)
          displayName: 'Build, Scan, and Push Docker Images'



